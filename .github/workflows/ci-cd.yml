
name: AutoParts CI/CD

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t autoparts:test .

      - name: Ejecutar pruebas Django
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=AutoParts.settings \
            autoparts:test \
            python manage.py test
